# Manifeste de l'add-on Home Assistant
# https://developers.home-assistant.io/docs/add-ons/configuration
name: Mail Agent
version: "0.1.0"
slug: mailagent
description: Tri de mails Gmail assisté par LLM (Gemini), avec panneau de contrôle et capteurs.
url: https://github.com/PyT/mailAgent
arch:
  - aarch64
  - amd64
init: true
startup: application
boot: auto

# Panneau dans la barre latérale (servi et authentifié par HA)
ingress: true
ingress_port: 8099
panel_icon: mdi:email-fast-outline
panel_title: Mail Agent

# Accès à l'API de HA (notifications) et identifiants MQTT fournis par le Supervisor
homeassistant_api: true
services:
  - mqtt:want

options:
  gemini_api_key: ""
  log_level: info
schema:
  gemini_api_key: password
  log_level: list(debug|info|warning|error)
